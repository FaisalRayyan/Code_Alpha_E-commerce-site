{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ShopSphere premium joggers e-commerce store."
    >

    <title>
        {% block title %}ShopSphere{% endblock %}
    </title>

    <link
    rel="stylesheet"
    href="{% static 'css/style.css' %}"
>

    <link
        rel="stylesheet"
        href="{% static 'css/global.css' %}"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body>
    {% if messages %}
        <div class="site-messages">
            {% for message in messages %}
                <div
                    class="site-message site-message--{{ message.tags }}"
                    role="alert"
                >
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <header class="site-header">
        <a
            href="{% url 'core:home' %}"
            class="site-header__brand"
        >
            ShopSphere
        </a>

        <nav
            class="site-header__navigation"
            aria-label="Main navigation"
        >
            <a href="{% url 'core:home' %}">
                Home
            </a>

            <a href="{% url 'products:product_list' %}">
                Shop
            </a>

            <a
                href="{% url 'cart:cart_detail' %}"
                class="site-header__cart"
            >
                Cart
                <span>{{ global_cart_count }}</span>
            </a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
